[package]
name = "tree-sitter-fluent"
description = "Fluent (Project Fluent localization) grammar for tree-sitter"
version = "0.1.0"
authors = ["Axel Hecht", "Andrew Sutherland <asutherland@asutherland.org>"]
license = "Apache-2.0"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "fluent", "l10n"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/mozsearch/tree-sitter-fluent"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "src/*",
  "tree-sitter.json",
  "LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.3"
